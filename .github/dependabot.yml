version: 2

updates:
  # Keep the actions used by our workflows and by our composite actions up to
  # date. Dependabot only scans action.yml files in the directories listed here,
  # so add each new action's directory to the list.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/show-trigger"
      - "/gpu-arch"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week with all the bumps, instead of one per action
      github-actions:
        patterns:
          - "*"
