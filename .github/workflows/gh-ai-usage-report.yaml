name: AI Usage Report

# This workflow pings the e3sm-project gh org (using a secret private key
# with proper read privileges) to get the current status of our ai credits
# usage. Then, it crafts and posts a message on the general-e3sm slack
# channel on e3sm-project.slack.com

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows running manually from GitHub UI

jobs:
  report-usage:
    runs-on: ubuntu-latest
    steps:
      # 1. Mint short-lived installation token from your GitHub App
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # 2. Query GitHub API and Post Report to Slack
      - name: Fetch Metrics and Post to Slack
        uses: actions/github-script@v7
        env:
          ORG_NAME: ${{ github.repository_owner }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const org = process.env.ORG_NAME;
            const slackWebhook = process.env.SLACK_WEBHOOK_URL;

            let usageDetails = "";

            try {
              // Endpoint for Copilot billing / seat breakdown
              const response = await github.request('GET /orgs/{org}/copilot/billing', {
                org: org,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });

              const seats = response.data.seat_breakdown;
              usageDetails = "- Total Assigned Seats: " + seats.total + "\n" +
                             "- Active Seats (This Cycle): " + seats.active_this_cycle + "\n" +
                             "- Inactive Seats: " + seats.inactive_this_cycle;
            } catch (err) {
              console.log("Could not fetch Copilot billing:", err.message);
              usageDetails = "Notice: Unable to parse seat breakdown. Verify App permissions for Organization Billing. Error: " + err.message;
            }

            // Construct formatted Slack message payload using standard plain text block
            const slackPayload = {
              text: "Daily AI Usage Report for " + org + ":\n\n" + usageDetails
            };

            // Post to Slack Webhook
            const res = await fetch(slackWebhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(slackPayload)
            });

            if (!res.ok) {
              throw new Error("Slack post failed with status " + res.status + ": " + res.statusText);
            }
