name: AI Usage Report

# This workflow pings the e3sm-project gh org (using a GitHub App's private key
# with proper read privileges) to get the current status of our ai credits
# usage. Then, it crafts and posts a message on the general-e3sm slack
# channel on e3sm-project.slack.com
#
# The logic lives in .github/scripts/gh_ai_usage_report.py (with unit tests).
#
# It also runs on any PR that touches this file or the script, as a dry run
# (everything except the Slack post: the message goes to the job summary), as a
# check that the REST calls still succeed and that the numbers they produce
# still parse as numbers.

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows running manually from GitHub UI
    inputs:
      dry_run:
        description: "Only write the job summary, don't post to Slack"
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/gh-ai-usage-report.yaml'
      - '.github/scripts/gh_ai_usage_report.py'

permissions:
  contents: read

jobs:
  report-usage:
    # Dependabot's PR runs can't read this repo's Actions secrets (they get a
    # separate set of Dependabot secrets), so the fetch would fail on the empty
    # APP_ID. Skip only that case: schedule and manual runs must never be skipped.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORG_NAME: ${{ github.repository_owner }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_E3SM_AI_HELP_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7

      # Mint short-lived installation token from your GitHub App
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Query the GitHub billing API, validate the numbers, craft the Slack
      # message and post it. On a pull_request run (or with dry_run) nothing is
      # posted: the message is printed and written to the job summary instead.
      - name: Build and post report
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
          python .github/scripts/gh_ai_usage_report.py "${args[@]}"

      # If the report failed on a real (non-PR, non-dry) run, alert Slack
      # instead of failing silently. PR runs surface failures via the check
      # itself, so no alert needed there.
      - name: Alert Slack on failure
        if: ${{ failure() && github.event_name != 'pull_request' && inputs.dry_run != true }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \":red_circle: AI Usage Report workflow failed for \`${ORG_NAME}\` - see ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
