name: AI Usage Report

# This workflow pings the e3sm-project gh org (using a secret private key
# with proper read privileges) to get the current status of our ai credits
# usage. Then, it crafts and posts a message on the general-e3sm slack
# channel on e3sm-project.slack.com

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows running manually from GitHub UI

jobs:
  report-usage:
    runs-on: ubuntu-latest
    steps:
      # 1. Mint short-lived installation token from your GitHub App
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # 2. Query GitHub Billing API and Post Report to Slack
      - name: Fetch Metrics and Post to Slack
        uses: actions/github-script@v7
        env:
          ORG_NAME: ${{ github.repository_owner }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const org = process.env.ORG_NAME;
            const slackWebhook = process.env.SLACK_WEBHOOK_URL;

            let usageDetails = "";

            // Helper to format currency
            const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val || 0);

            try {
              // Attempt 1: Fetch Enterprise / Org Budget status
              const response = await github.request('GET /orgs/{org}/settings/billing/summary', {
                org: org,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' }
              });

              const data = response.data;
              const used = formatUSD(data.total_amount_spent);
              const budget = data.budget_limit ? formatUSD(data.budget_limit) : "Unlimited";
              
              let pctStr = "";
              if (data.budget_limit && data.budget_limit > 0) {
                pctStr = " (" + ((data.total_amount_spent / data.budget_limit) * 100).toFixed(1) + "% used)";
              }

              usageDetails = "AI Credit Usage: " + used + " / " + budget + pctStr;

            } catch (err) {
              console.log("Org-level billing API error:", err.message);

              // Attempt 2: Fallback for Enterprise Billing API endpoint
              try {
                const entResp = await github.request('GET /enterprises/{enterprise}/settings/billing/summary', {
                  enterprise: org,
                  headers: { 'X-GitHub-Api-Version': '2022-11-28' }
                });

                const data = entResp.data;
                usageDetails = "Enterprise Billing Usage: " + formatUSD(data.total_gross_amount) + " / " + formatUSD(data.budget_limit);
              } catch (entErr) {
                console.log("Enterprise-level billing API error:", entErr.message);
                usageDetails = "Notice: Unable to access billing API directly. Ensure the GitHub App has 'Enterprise Billing: Read-Only' permissions.";
              }
            }

            // Construct formatted Slack message
            const slackPayload = {
              text: "Daily Usage Report for " + org + ":\n\n" + usageDetails
            };

            // Post to Slack Webhook
            const res = await fetch(slackWebhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(slackPayload)
            });

            if (!res.ok) {
              throw new Error("Slack post failed with status " + res.status + ": " + res.statusText);
            }
