name: Test actions

# Smoke tests for the reusable actions (the <name>/action.yml directories at
# the repo root). Each action runs for real on a runner (via a local
# `uses: ./<name>`), so a broken action.yml or a failing step is caught before
# anyone pins a tag to it.
#
# To add a new action: copy the show-trigger job below, point `uses:` at the new
# directory, and add whatever assertions make sense for that action.

on:
  pull_request:
    paths:
      - '*/action.yml'
      - '*/tests/**'
      - '.github/workflows/test-actions.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run the action
        id: trigger
        uses: ./show-trigger
      # The action never fails the job on its own (errors become warnings), so
      # check its output. (A later step can't read the job summary written by an
      # earlier one: each step gets its own $GITHUB_STEP_SUMMARY file.)
      - name: Check the action collected everything
        run: test "${{ steps.trigger.outputs.collected }}" = "true"

  gpu-arch:
    # No GPUs on hosted runners: fake nvidia-smi/rocminfo with gpu-arch/tests/fake-gpu-tool
    # and check what the action reports. Each row is one test case:
    #   tool/out/rc: the fake tool to put on PATH, what it prints, its exit code
    #   outcome:     what the action must do (success or failure)
    #   vendor/arch/configs: the expected outputs (for outcome=success)
    name: gpu-arch (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two GPUs: only the first is used
          - {case: nvidia-h100-x2, tool: nvidia-smi, out: "NVIDIA H100 80GB HBM3\nNVIDIA H100 80GB HBM3", outcome: success, vendor: nvidia, arch: HOPPER90, configs: "Kokkos_ARCH_HOPPER90=ON;CMAKE_CUDA_ARCHITECTURES=90"}
          - {case: nvidia-a100, tool: nvidia-smi, out: "NVIDIA A100-SXM4-40GB", outcome: success, vendor: nvidia, arch: AMPERE80, configs: "Kokkos_ARCH_AMPERE80=ON;CMAKE_CUDA_ARCHITECTURES=80"}
          - {case: nvidia-v100, tool: nvidia-smi, out: "Tesla V100-SXM2-16GB", outcome: success, vendor: nvidia, arch: VOLTA70, configs: "Kokkos_ARCH_VOLTA70=ON;CMAKE_CUDA_ARCHITECTURES=70"}
          - {case: amd-gfx942, tool: rocminfo, out: gfx942, outcome: success, vendor: amd, arch: AMD_GFX942, configs: "Kokkos_ARCH_AMD_GFX942=ON"}
          - {case: amd-gfx90a, tool: rocminfo, out: gfx90a, outcome: success, vendor: amd, arch: AMD_GFX90A, configs: "Kokkos_ARCH_AMD_GFX90A=ON"}
          - {case: amd-gfx908, tool: rocminfo, out: gfx908, outcome: success, vendor: amd, arch: AMD_GFX908, configs: "Kokkos_ARCH_AMD_GFX908=ON"}
          # The action must fail loudly on these
          - {case: nvidia-unsupported, tool: nvidia-smi, out: "Tesla T4", outcome: failure}
          - {case: amd-unsupported, tool: rocminfo, out: gfx1100, outcome: failure}
          - {case: nvidia-smi-fails, tool: nvidia-smi, out: "", rc: 9, outcome: failure}
          - {case: no-tool, tool: none, outcome: failure}
    steps:
      - uses: actions/checkout@v7
      - name: Put the fake GPU tool on PATH
        if: ${{ matrix.tool != 'none' }}
        env:
          TOOL: ${{ matrix.tool }}
          OUT: ${{ matrix.out }}
          RC: ${{ matrix.rc || 0 }}
        run: |
          d="$RUNNER_TEMP/fake-gpu"
          mkdir -p "$d"
          cp gpu-arch/tests/fake-gpu-tool "$d/$TOOL"
          printf '%s\n' "$OUT" > "$d/output.txt"
          echo "$RC" > "$d/rc"
          echo "$d" >> "$GITHUB_PATH"
      - name: Run the action
        id: gpu
        uses: ./gpu-arch
        continue-on-error: true  # the expected-failure cases; checked below
      - name: Check the result
        env:
          OUTCOME: ${{ steps.gpu.outcome }}
          VENDOR: ${{ steps.gpu.outputs.vendor }}
          ARCH: ${{ steps.gpu.outputs.kokkos-arch }}
          CONFIGS: ${{ steps.gpu.outputs.cmake-configs }}
        run: |
          test "$OUTCOME" = "${{ matrix.outcome }}"
          if [ "${{ matrix.outcome }}" = success ]; then
            test "$VENDOR" = "${{ matrix.vendor }}"
            test "$ARCH" = "${{ matrix.arch }}"
            test "$CONFIGS" = "${{ matrix.configs }}"
          fi
